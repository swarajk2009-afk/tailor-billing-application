name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor & Add Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Tailor Billing App" "com.tailorbilling.app" --web-dir www
          npx cap add android

      - name: Configure Storage Permissions & TailorBilling Folder
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > android/app/src/main/java/com/tailorbilling/app/MainActivity.java
          package com.tailorbilling.app;

          import android.os.Bundle;
          import android.os.Environment;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  File picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                  File appFolder = new File(picturesDir, "TailorBilling");
                  if (!appFolder.exists()) {
                      appFolder.mkdirs();
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Tailor-Billing-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
